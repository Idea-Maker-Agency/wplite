version: '3.6'
services:
  mysql:
    image: mysql:latest
    container_name: wplite-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    restart: always

  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin:latest
    container_name: wplite-phpmyadmin
    restart: always
    ports:
      - 8180:80
    environment:
      - PMA_HOST=mysql
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}

  sass:
    image: node:14
    container_name: wplite-sass
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    command: sh -c "npm install && npm run watch:sass"

  wordpress:
    depends_on:
      - mysql
      - phpmyadmin
    image: wordpress:latest
    container_name: wplite-wordpress
    volumes:
      - ./theme:/var/www/html/wp-content/themes/wplite
    environment:
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_HOST=${DB_HOST}
      - WORDPRESS_DB_USER=root
      - WORDPRESS_DB_PASSWORD=${DB_ROOT_PASSWORD}
      - WORDPRESS_TABLE_PREFIX=${WP_TABLE_PREFIX}
      - WORDPRESS_DEBUG=${WP_DEBUG}
    restart: always
    ports:
      - 8080:80

  composer:
    image: composer:latest
    container_name: wplite-composer
    volumes:
      - ./theme:/app
    working_dir: /app
    command: install

  theme-builder:
    image: node:14
    container_name: wplite-theme-builder
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    entrypoint: sh -c "npm run compile:sass && npm run compile:purify-css && cp -r theme wplite"

volumes:
  mysql_data: {}
