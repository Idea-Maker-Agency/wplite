sample_page:
  group: "Sample page template custom fields"
  fields:
    sample_text:
      type: text
      label: "Sample text field"
      helper_text: "Lorem ipsum dolor sit amet, consectet"
      required: true

    sample_select:
      type: select
      label: "Sample select field"
      required: true
      options:
        - label: "Option 1"
          value: "option1"

        - label: "Option 2"
          value: "option2"

    sample_wpeditor:
      type: wpeditor
      label: "Sample WP editor field"

    sample_checkbox:
      type: checkbox
      label: "Sample checkbox field"

    sample_image:
      type: image
      label: "Sample image field"
